name: Publish portfolio

on:
  push:
    branches: [main]
    paths:
      - portfolio/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build Arabic and English pages
        env:
          PORTFOLIO_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 -B portfolio/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
      - uses: actions/deploy-pages@v5
        id: deployment
